# Nginx: timeouts for MedicalAI (OCR / RuTronix can exceed 60s).
# Edit: sudo nano /etc/nginx/sites-available/medical
#
# Place the following INSIDE the same `location` that has `proxy_pass` to the Gunicorn socket
# (usually `location /` or `location /api/`). Do not put proxy_* outside `location` unless you know your layout.
#
# After editing:
#   sudo nginx -t && sudo systemctl reload nginx

proxy_connect_timeout 180s;
proxy_send_timeout 180s;
proxy_read_timeout 180s;
# Large multipart (lab photo); skip if you already set client_max_body_size elsewhere
client_max_body_size 32m;
client_body_timeout 120s;
